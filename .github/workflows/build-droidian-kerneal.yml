name: Build Droidian Kernel Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - droidian
      - halium-11.0

jobs:
  build-kernel-deb:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Debian Packaging Files
        run: |
          # 1. 自动向 defconfig 追加 Droidian 启动依赖
          DEFCONFIG="arch/arm64/configs/vendor/fp4-perf_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs -name "*fp4*" | head -n 1)
          fi
          echo "Injecting into: $DEFCONFIG"
          
          printf "\n# Droidian Configs\nCONFIG_PID_NS=y\nCONFIG_UTS_NS=y\nCONFIG_IPC_NS=y\nCONFIG_NET_NS=y\nCONFIG_USER_NS=y\nCONFIG_VT=y\nCONFIG_VT_CONSOLE=y\nCONFIG_VT_HW_CONSOLE_BINDING=y\nCONFIG_FRAMEBUFFER_CONSOLE=y\nCONFIG_DEVTMPFS=y\nCONFIG_DEVTMPFS_MOUNT=y\nCONFIG_FHANDLE=y\nCONFIG_AUTOFS4_FS=y\nCONFIG_TMPFS_XATTR=y\nCONFIG_FANOTIFY=y\nCONFIG_FANOTIFY_ACCESS_PERMS=y\nCONFIG_RD_GZIP=y\nCONFIG_RD_BZIP2=y\nCONFIG_RD_LZMA=y\nCONFIG_RD_XZ=y\nCONFIG_RD_LZO=y\nCONFIG_RD_LZ4=y\nCONFIG_SECURITY_APPARMOR=y\nCONFIG_DEFAULT_SECURITY_APPARMOR=y\nCONFIG_BLK_DEV_DM=y\nCONFIG_DM_CRYPT=y\n" >> "$DEFCONFIG"

          # 2. 创建 debian 目录
          mkdir -p debian/source

          # 3. 创建 debian/compat 与 format
          echo 13 > debian/compat
          echo "3.0 (native)" > debian/source/format

          # 4. 创建 debian/rules (必须包含真实 Tab 缩进)
          printf '#!/usr/bin/make -f\ninclude /usr/share/linux-packaging-snippets/kernel-snippet.mk\n\n%%:\n\tdh $@\n' > debian/rules
          chmod +x debian/rules

          # 5. 创建 debian/kernel-info.mk
          printf 'KERNEL_BASE_VERSION = 4.19\nKERNEL_ARCH = arm64\nDEB_BUILD_FOR = arm64\nKERNEL_DEFCONFIG = vendor/fp4-perf_defconfig\nBUILD_CC = clang\nDEB_TOOLCHAIN = clang-android-10.0-r370808\nBUILD_PATH = /usr/lib/llvm-android-10.0-r370808/bin\nBUILD_TARGET = Image.gz-dtb\nKERNEL_IMAGE_WITH_DTB = 1\nKERNEL_BOOTIMAGE_CMDLINE = console=ttyMSM0,115200n8 console=tty0 droidian.lvm.prefer earlycon=msm_geni_serial,0xa90000 androidboot.hardware=qcom androidboot.console=ttyMSM0 loop.max_part=7\nKERNEL_BOOTIMAGE_VERSION = 2\nKERNEL_BOOTIMAGE_PAGE_SIZE = 4096\nFLASH_ENABLED = 1\nFLASH_INFO_MANUFACTURER = Fairphone\nFLASH_INFO_MODEL = FP4\nFLASH_INFO_CPU = Qualcomm Technologies, Inc SM7225\n' > debian/kernel-info.mk

          # 验证文件是否正确生成
          ls -la debian/
          cat debian/kernel-info.mk

      - name: Build Kernel Deb via Droidian Container
        run: |
          mkdir -p "${{ github.workspace }}/pkgs"

          # 启动 Droidian 官方打包环境
          docker run --rm \
            -v "${{ github.workspace }}/pkgs:/buildd" \
            -v "${{ github.workspace }}:/buildd/sources" \
            -w /buildd/sources \
            quay.io/droidian/build-essential:current-amd64 \
            bash -c '
              set -e
              git config --global --add safe.directory /buildd/sources
              apt-get update
              apt-get install -y linux-packaging-snippets
              
              # 重新生成 debian/control
              rm -f debian/control
              debian/rules debian/control
              
              # 执行交叉打包
              RELENG_HOST_ARCH=arm64 releng-build-package
            '

      - name: Check Package Outputs
        run: |
          ls -la "${{ github.workspace }}/pkgs"

      - name: Upload Kernel Packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-fp4-kernel-deb
          path: pkgs/*.deb
          if-no-files-found: error
