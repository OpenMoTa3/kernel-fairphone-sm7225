name: Build Droidian Kernel Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - droidian
      - halium-11.0

jobs:
  build-kernel-deb:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auto-Inject Droidian Defconfig Fixes
        run: |
          # 自动向 defconfig 末尾注入 Droidian 启动所必须的特性
          DEFCONFIG="arch/arm64/configs/vendor/fp4-perf_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            # 兼容不同命名路径
            DEFCONFIG=$(find arch/arm64/configs -name "*fp4*" | head -n 1)
          fi
          echo "Injecting configs into $DEFCONFIG"

          cat << 'EOF' >> "$DEFCONFIG"

# Droidian / Halium 11 Requirements
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_VT_HW_CONSOLE_BINDING=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_AUTOFS4_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_FANOTIFY=y
CONFIG_FANOTIFY_ACCESS_PERMS=y
CONFIG_RD_GZIP=y
CONFIG_RD_BZIP2=y
CONFIG_RD_LZMA=y
CONFIG_RD_XZ=y
CONFIG_RD_LZO=y
CONFIG_RD_LZ4=y
CONFIG_SECURITY_APPARMOR=y
CONFIG_DEFAULT_SECURITY_APPARMOR=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y
EOF

      - name: Auto-Create Debian Packaging Structure
        run: |
          # 自动创建 Droidian 官方要求的 debian 目录及所有配置文件
          mkdir -p debian/source

          # 1. 创建 compat
          echo 13 > debian/compat

          # 2. 创建 format
          echo "3.0 (native)" > debian/source/format

          # 3. 创建 rules
          cat << 'EOF' > debian/rules
#!/usr/bin/make -f
include /usr/share/linux-packaging-snippets/kernel-snippet.mk

%:
	dh $@
EOF
          chmod +x debian/rules

          # 4. 创建 kernel-info.mk
          cat << 'EOF' > debian/kernel-info.mk
KERNEL_BASE_VERSION = 4.19
KERNEL_ARCH = arm64
DEB_BUILD_FOR = arm64

KERNEL_DEFCONFIG = vendor/fp4-perf_defconfig

BUILD_CC = clang
DEB_TOOLCHAIN = clang-android-10.0-r370808
BUILD_PATH = /usr/lib/llvm-android-10.0-r370808/bin

BUILD_TARGET = Image.gz-dtb
KERNEL_IMAGE_WITH_DTB = 1

KERNEL_BOOTIMAGE_CMDLINE = console=ttyMSM0,115200n8 console=tty0 droidian.lvm.prefer earlycon=msm_geni_serial,0xa90000 androidboot.hardware=qcom androidboot.console=ttyMSM0 loop.max_part=7

KERNEL_BOOTIMAGE_VERSION = 2
KERNEL_BOOTIMAGE_PAGE_SIZE = 4096

FLASH_ENABLED = 1
FLASH_INFO_MANUFACTURER = Fairphone
FLASH_INFO_MODEL = FP4
FLASH_INFO_CPU = Qualcomm Technologies, Inc SM7225
EOF

      - name: Build Kernel Deb via Droidian Docker
        run: |
          mkdir -p "${{ github.workspace }}/pkgs"

          # 启动 Droidian 官方打包容器进行编译
          docker run --rm \
            -v "${{ github.workspace }}/pkgs:/buildd" \
            -v "${{ github.workspace }}:/buildd/sources" \
            -w /buildd/sources \
            quay.io/droidian/build-essential:current-amd64 \
            /bin/bash -c "
              set -e
              apt-get update
              apt-get install -y linux-packaging-snippets
              
              # 生成 debian/control
              rm -f debian/control
              debian/rules debian/control
              
              # 启动交叉编译并生成 deb 包
              RELENG_HOST_ARCH=arm64 releng-build-package
            "

      - name: Upload Kernel Packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-fp4-kernel-deb
          path: pkgs/*.deb
          if-no-files-found: error
